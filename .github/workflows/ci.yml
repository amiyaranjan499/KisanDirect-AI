name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: kisandirect
          POSTGRES_USER: kisandirect
          POSTGRES_PASSWORD: kisandirect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kisandirect -d kisandirect"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt ruff
      - name: Lint
        run: ruff check backend scripts
      - name: Migrate
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://kisandirect:kisandirect@localhost:5432/kisandirect
          TEST_DATABASE_URL: postgresql+psycopg://kisandirect:kisandirect@localhost:5432/kisandirect_test
          JWT_SECRET_KEY: ci-only-secret-with-at-least-32-characters
        run: |
          PGPASSWORD=kisandirect psql -h localhost -U kisandirect -d postgres -c "CREATE DATABASE kisandirect_test"
          cd backend
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
      - name: Test
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://kisandirect:kisandirect@localhost:5432/kisandirect
          TEST_DATABASE_URL: postgresql+psycopg://kisandirect:kisandirect@localhost:5432/kisandirect_test
          JWT_SECRET_KEY: ci-only-secret-with-at-least-32-characters
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
